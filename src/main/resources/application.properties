app.base-url=${APP_URL:http://localhost:8082}

server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/StepWave}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SQL_LOG:false}
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.strategy.content.enabled=true

# Пароль приложения Gmail (не основной пароль аккаунта), заводится через переменные окружения
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:noreply@example.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
